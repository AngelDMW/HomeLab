services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Santo_Domingo
      - WEBUI_PORT=8081
    volumes:
      - ./qbittorrent:/config
      - /home/mrdavid/HomeLab/media:/media
    ports:
      - 8081:8081
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Santo_Domingo
    volumes:
      - ./prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Santo_Domingo
    volumes:
      - ./radarr:/config
      - /home/mrdavid/HomeLab/media:/media
    ports:
      - 7878:7878
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Santo_Domingo
    volumes:
      - ./sonarr:/config
      - /home/mrdavid/HomeLab/media:/media
    ports:
      - 8989:8989
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    environment:
      - TZ=America/Santo_Domingo
    volumes:
      - ./jellyseerr:/app/config
    ports:
      - 127.0.0.1:5056:5055
    restart: unless-stopped

  # Reverse proxy ligero: inyecta el tema HomeFlix sin tocar la imagen de Seerr
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  seerr-theme:
    image: nginx:alpine
    container_name: seerr-theme
    mem_limit: 64m
    depends_on:
      - jellyseerr
    volumes:
      - ./seerr-theme/conf:/etc/nginx/conf.d:ro
      - ./seerr-theme/html:/usr/share/nginx/html:ro
    ports:
      - 5055:80
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Santo_Domingo
    ports:
      - 8191:8191
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Santo_Domingo
    volumes:
      - ./bazarr:/config
      - /home/mrdavid/HomeLab/media:/media
    ports:
      - 6767:6767
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
