map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $seerr_upstream http://jellyseerr:5055;

    # ---------- Assets del tema HomeFlix (servidos localmente) ----------
    # El versionado (?v=...) se ignora en la coincidencia exacta de nginx.
    location = /theme/custom-theme.css {
        alias /usr/share/nginx/html/custom-theme.css;
        default_type text/css;
        types { }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /theme/hf-mobile.js {
        alias /usr/share/nginx/html/hf-mobile.js;
        default_type application/javascript;
        types { }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Compatibilidad con el link anterior (posible caché en Safari)
    location = /custom-theme.css {
        alias /usr/share/nginx/html/custom-theme.css;
        default_type text/css;
        types { }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- Proxy hacia Seerr ----------
    location / {
        proxy_pass $seerr_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / SSE (mapa $connection_upgrade definido arriba)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Imprescindible para sub_filter: el upstream no debe comprimir
        proxy_set_header Accept-Encoding "";

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;

        # ---------- Inyección PWA / tema (solo text/html) ----------
        sub_filter_once off;

        # 1) Manifiesto de Seerr -> manifiesto HomeFlix
        sub_filter '<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials"/>' '<link rel="manifest" href="/manifest.json"/>';

        # 2) Un único theme-color, carbón
        sub_filter '<meta name="theme-color" content="#1f2937"/>' '<meta name="theme-color" content="#0b0b0f"/>';

        # 3) Viewport canónico (evita zoom accidental en iOS)
        sub_filter '<meta name="viewport" content="initial-scale=1, viewport-fit=cover, width=device-width" data-next-head=""/>' '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-next-head=""/>';

        # 4) iOS PWA + CSS/JS versionados. Va al final porque contiene </head>.
        sub_filter '</head>' '<meta name="apple-mobile-web-app-capable" content="yes"/><link rel="stylesheet" href="/theme/custom-theme.css?v=20261119"/><script src="/theme/hf-mobile.js?v=20261119" defer></script></head>';
    }
}
