map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $seerr_upstream http://jellyseerr:5055;

    # Tema inyectado (se sirve local, sin tocar la imagen de Seerr)
    location = /custom-theme.css {
        root /usr/share/nginx/html;
        default_type text/css;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass $seerr_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Necesario para que sub_filter pueda reescribir el HTML
        proxy_set_header Accept-Encoding "";

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;

        sub_filter_once off;
        sub_filter '</head>' '<link rel="stylesheet" href="/custom-theme.css"><meta name="theme-color" content="#0b0b0d"></head>';
    }
}
