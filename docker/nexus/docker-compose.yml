services:
  nexus:
    build: .
    container_name: homelab-nexus
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
