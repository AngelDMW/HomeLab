services:
  unbound:
    container_name: unbound
    image: klutchell/unbound:latest
    restart: unless-stopped
    ports:
      # Solo loopback en el host para pruebas de DNSSEC; Pi-hole usa unbound#5335
      # a través de la red interna pihole_default.
      - "127.0.0.1:5335:5335/tcp"
      - "127.0.0.1:5335:5335/udp"
    volumes:
      - ./unbound/homelab.conf:/etc/unbound/custom.conf.d/zz-homelab.conf:ro
    healthcheck:
      test: ["CMD", "/usr/bin/drill", "-p", "5335", "@127.0.0.1", "cloudflare.com", "A"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
    environment:
      TZ: 'America/Santo_Domingo'
      WEBPASSWORD: '${PIHOLE_PASSWORD:-admin}'
      FTLCONF_dns_listeningMode: 'ALL'
      # Único upstream: Unbound recursivo con DNSSEC (equivalente v6 de PIHOLE_DNS_)
      FTLCONF_dns_upstreams: 'unbound#5335'
    volumes:
      - pihole_data:/etc/pihole
      - dnsmasq_data:/etc/dnsmasq.d
    depends_on:
      unbound:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  # Nombres reales creados por el stack original de Portainer (proyecto pihole).
  pihole_data:
    external: true
    name: pihole_pihole_data
  dnsmasq_data:
    external: true
    name: pihole_dnsmasq_data
