# HomeLab Unbound — resolvedor recursivo de raíz con DNSSEC estricto
# Se incluye desde /etc/unbound/unbound.conf (include-toplevel) de klutchell/unbound.
# Pi-hole lo consume como único upstream en unbound#5335.

server:
    # El contenedor escucha en 5335 (sin privilegios). El host solo publica
    # 127.0.0.1:5335 para diagnóstico; Pi-hole lo alcanza por pihole_default.
    port: 5335

    # Resolución recursiva IPv4 de raíz; sin reenvío a Google/Cloudflare/ISP.
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Privacidad: minimización de nombres QNAME.
    qname-minimisation: yes

    # Caché caliente: prefetch proactivo de entradas próximas a expirar.
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    cache-min-ttl: 60
    cache-max-ttl: 86400
    msg-cache-size: 16m
    rrset-cache-size: 32m
    neg-cache-size: 4m

    # DNSSEC estricto: el ancla de confianza se mantiene con RFC 5011
    # en /var/unbound/root.key (auto-trust-anchor-file de la imagen base).
    val-clean-additional: yes
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    harden-algo-downgrade: yes
    harden-large-queries: yes
    harden-short-bufsize: yes

    # ACL: solo redes privadas. Cualquier otro origen se rechaza.
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.1.0/24 allow
    access-control: 172.16.0.0/12 allow
    access-control: 100.64.0.0/10 allow
    access-control: 0.0.0.0/0 refuse

    # Endurecimiento del servicio y anti-spoofing.
    hide-identity: yes
    hide-version: yes
    deny-any: yes
    unwanted-reply-threshold: 10000000
    edns-buffer-size: 1232
    so-reuseport: yes
    ratelimit: 1000

    # Sin log por consulta; solo eventos operativos.
    verbosity: 1
    log-queries: no
    log-replies: no
