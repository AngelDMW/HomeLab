services:
  bot:
    build: .
    container_name: optiplex-chatops
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - AI_BRAIN_PORT=5057
      - GEMINI_MODEL=gemini-2.5-flash
      - SENTINEL_URL=http://127.0.0.1:9090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/hostfs:ro
      - ./data:/app/data
      - /home/mrdavid/.ssh/node2_bot:/app/ssh/id_ed25519:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
